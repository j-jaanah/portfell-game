<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Board Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
<body>

  <div class="container">

    <h1>Stock Board Game</h1>

    <div id="homeScreen">

      <button onclick="showNewGame()">
        New Game
      </button>

      <button onclick="showJoinGame()">
        Join Game
      </button>

    </div>

    <div id="joinScreen" style="display:none;">

      <h2>Join Game</h2>

      <input type="text" id="joinGameId" placeholder="Game ID">

      <input type="text" id="joinPlayerName" placeholder="Player Name">

      <button onclick="joinGame()">
        Join
      </button>

    </div>

    <div id="newGameScreen" style="display:none;">

      <h2>Create Game</h2>

      <input type="text" id="hostName" placeholder="Host Name">

      <button onclick="createGame()">
        Create Game
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
  
<body>

</html>
