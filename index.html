<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Board Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Stock Board Game</h1>

    <div id="homeScreen">

      <button onclick="showNewGame()">
        New Game
      </button>

      <button onclick="showJoinGame()">
        Join Game
      </button>

    </div>

    <div id="joinScreen" style="display:none;">

      <h2>Join Game</h2>

      <input type="text" id="joinGameId" placeholder="Game ID">

      <input type="text" id="joinPlayerName" placeholder="Player Name">

      <button onclick="joinGame()">
        Join
      </button>
      
      <button onclick="goHome()">
      Back
      </button>

    </div>

    <div id="newGameScreen" style="display:none;">

      <h2>Create Game</h2>

      <input type="text" id="hostName" placeholder="Host Name">

      <button onclick="createGame()">
        Create Game
      </button>
      
      <button onclick="goHome()">
        Back
      </button>

    </div>

  </div>

<div id="gameScreen" style="display:none;">

  <h2 id="gameTitle"></h2>

  <p id="playerInfo"></p>

  <p>Round: 1</p>

  <h2>Stocks</h2>

  <div class="stock">
    <span>TechCorp</span>
    <span>12</span>
  </div>

  <div class="stock">
    <span>OilCo</span>
    <span>8</span>
  </div>

  <div class="stock">
    <span>BankGroup</span>
    <span>15</span>
  </div>

</div>

  <script src="script.js"></script>
  
<body>

</html>
